[package]
name = "tradingview"
description = "Rust bindings for leveraging TradingView functionalities"
version = "0.1.1"
edition = "2021"
authors = ["Jesper Håkansson <jesper@jesperh.se>"]
repository = "https://github.com/drager/tradingview.git"
license = "Apache-2.0"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "multipart",
    "cookies",
] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [ "full" ] }
tokio-tungstenite = { version = "0.24", features = ["url"] }
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
typed-builder = "0.23"
thiserror = "2"
regex = "1"
either = { version = "1", features = ["serde"]}
log = "0.4"
rand = "0.9"
libreauth = "0.18"
env_logger = "0.11"
async-stream = "0.3"
# Only used to pin the ring crypto provider when the `rustls` feature is on:
# feature unification can leave rustls with both `ring` and `aws-lc-rs`
# enabled (e.g. reqwest prefers aws-lc-rs), which makes rustls refuse to
# auto-select and panic on first use.
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "ring",
    "logging",
    "std",
    "tls12",
] }

[dev-dependencies]
httpmock = "0.8"

[features]
default = []
# TLS via OpenSSL (native-tls) for both HTTPS and the WebSocket.
native-tls = ["tokio-tungstenite/native-tls", "reqwest/native-tls"]
# TLS via rustls with the ring provider and webpki roots — no OpenSSL, so
# this is the right choice for static (musl) builds.
rustls = [
    "tokio-tungstenite/rustls-tls-webpki-roots",
    "reqwest/rustls-tls",
    "dep:rustls",
]
